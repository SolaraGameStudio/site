<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Solara Studio Games</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
  margin: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #050814;
  color: #f5f5f5;
}
header {
  padding: 1.5rem 2rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: linear-gradient(90deg, #111827, #1f2937);
  border-bottom: 1px solid #1f2937;
}
header h1 {
  margin: 0;
  font-size: 1.4rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
header span {
  font-size: 0.9rem;
  color: #9ca3af;
}
.main {
  padding: 2rem;
  max-width: 1200px;
  margin: 0 auto;
}
.section-title {
  font-size: 1.2rem;
  margin-bottom: 1rem;
}
.carousel {
  position: relative;
  overflow: hidden;
}
.carousel-track {
  display: flex;
  transition: transform 0.4s ease;
  will-change: transform;
}
.game-card {
  min-width: 100%;
  box-sizing: border-box;
  padding: 1.5rem;
  display: grid;
  grid-template-columns: minmax(0, 2fr) minmax(0, 3fr);
  gap: 1.5rem;
  background: radial-gradient(circle at top left, #1f2937 0, #020617 55%);
  border-radius: 1rem;
  border: 1px solid #1f2937;
}
.game-media {
  position: relative;
  border-radius: 0.75rem;
  overflow: hidden;
  background: #020617;
}
.game-media img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.game-media a {
  position: absolute;
  bottom: 0.75rem;
  right: 0.75rem;
  padding: 0.4rem 0.7rem;
  font-size: 0.75rem;
  border-radius: 999px;
  background: rgba(15, 23, 42, 0.85);
  color: #e5e7eb;
  text-decoration: none;
}
.game-content h2 {
  margin: 0 0 0.5rem;
  font-size: 1.3rem;
}
.game-content p {
  margin: 0 0 0.75rem;
  font-size: 0.95rem;
  color: #d1d5db;
}
.tags {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
  margin-bottom: 1rem;
}
.tag {
  padding: 0.25rem 0.6rem;
  border-radius: 999px;
  font-size: 0.75rem;
  background: rgba(55, 65, 81, 0.7);
  color: #e5e7eb;
}
.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 0.6rem;
}
.button-primary {
  padding: 0.6rem 1.1rem;
  border-radius: 999px;
  border: none;
  cursor: pointer;
  font-size: 0.9rem;
  background: linear-gradient(135deg, #22c55e, #0ea5e9);
  color: #020617;
}
.button-secondary {
  padding: 0.6rem 1.1rem;
  border-radius: 999px;
  border: 1px solid #4b5563;
  cursor: pointer;
  font-size: 0.9rem;
  background: #020617;
  color: #e5e7eb;
}
.button-link {
  padding: 0.4rem 0.8rem;
  border-radius: 999px;
  border: none;
  cursor: pointer;
  font-size: 0.8rem;
  background: #111827;
  color: #9ca3af;
}
.carousel-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 1rem;
}
.nav-buttons {
  display: flex;
  gap: 0.5rem;
}
.nav-button {
  width: 2.2rem;
  height: 2.2rem;
  border-radius: 999px;
  border: 1px solid #4b5563;
  background: #020617;
  color: #e5e7eb;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.nav-indicators {
  display: flex;
  gap: 0.4rem;
}
.indicator {
  width: 0.5rem;
  height: 0.5rem;
  border-radius: 999px;
  background: #1f2937;
}
.indicator.active {
  background: #22c55e;
}
@media (max-width: 768px) {
  .main {
    padding: 1.25rem;
  }
  .game-card {
    grid-template-columns: minmax(0, 1fr);
  }
}
</style>
</head>
<body>
<header>
  <div>
    <h1>Solara Studio</h1>
    <span>VR & PC Experiences</span>
  </div>
  <span>GitHub Showcase</span>
</header>
<div class="main">
  <div class="section-title">Games</div>
  <div class="carousel" id="gameCarousel">
    <div class="carousel-track" id="carouselTrack"></div>
    <div class="carousel-nav">
      <div class="nav-buttons">
        <button class="nav-button" id="prevBtn">&#8592;</button>
        <button class="nav-button" id="nextBtn">&#8594;</button>
      </div>
      <div class="nav-indicators" id="navIndicators"></div>
    </div>
  </div>
</div>
<script>
const games = [
  {
    title: "Humain Tag",
    description: "A fast-paced VR Gorilla Tag inspired locomotion game where you have fun with friends.",
    image: "https://i.postimg.cc/8P14kFCp/Untitled-03-August-2026-at-14-20-19.png",
    imageLink: "https://your-cdn-or-image-link.example/nebula-drift-gallery",
    tags: ["VR", "Quest", "Pico", "PCVR"],
    sidequestUrl: "https://sidequestvr.com/",
    steamUrl: "https://store.steampowered.com/app/",
    metaUrl: "https://www.meta.com/experiences/"
  },
  {
    title: "Nothing Yet...",
    description: "Something may be in the works...",
    image: "https://your-cdn-or-image-link.example/solar-echoes-cover.jpg",
    imageLink: "https://your-cdn-or-image-link.example/solar-echoes-gallery",
    tags: ["VR", "Puzzle", "Exploration", "Immersive"],
    sidequestUrl: "https://sidequestvr.com/",
    steamUrl: "https://store.steampowered.com/app/",
    metaUrl: "https://www.meta.com/experiences/"
  }
];
const track = document.getElementById("carouselTrack");
const indicatorsContainer = document.getElementById("navIndicators");
let currentIndex = 0;
function createGameCard(game, index) {
  const card = document.createElement("article");
  card.className = "game-card";
  const media = document.createElement("div");
  media.className = "game-media";
  const img = document.createElement("img");
  img.src = game.image;
  img.alt = game.title;
  const imgLink = document.createElement("a");
  imgLink.href = game.imageLink;
  imgLink.target = "_blank";
  imgLink.rel = "noopener noreferrer";
  imgLink.textContent = "View images";
  media.appendChild(img);
  media.appendChild(imgLink);
  const content = document.createElement("div");
  content.className = "game-content";
  const title = document.createElement("h2");
  title.textContent = game.title;
  const desc = document.createElement("p");
  desc.textContent = game.description;
  const tags = document.createElement("div");
  tags.className = "tags";
  game.tags.forEach(t => {
    const tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = t;
    tags.appendChild(tag);
  });
  const actions = document.createElement("div");
  actions.className = "actions";
  const downloadBtn = document.createElement("button");
  downloadBtn.className = "button-primary";
  downloadBtn.textContent = "Download via SideQuest";
  downloadBtn.onclick = () => window.open(game.sidequestUrl, "_blank", "noopener");
  const steamBtn = document.createElement("button");
  steamBtn.className = "button-secondary";
  steamBtn.textContent = "Steam listing";
  steamBtn.onclick = () => window.open(game.steamUrl, "_blank", "noopener");
  const metaBtn = document.createElement("button");
  metaBtn.className = "button-secondary";
  metaBtn.textContent = "Meta listing";
  metaBtn.onclick = () => window.open(game.metaUrl, "_blank", "noopener");
  const moreBtn = document.createElement("button");
  moreBtn.className = "button-link";
  moreBtn.textContent = "SideQuest details";
  moreBtn.onclick = () => window.open(game.sidequestUrl, "_blank", "noopener");
  actions.appendChild(downloadBtn);
  actions.appendChild(steamBtn);
  actions.appendChild(metaBtn);
  actions.appendChild(moreBtn);
  content.appendChild(title);
  content.appendChild(desc);
  content.appendChild(tags);
  content.appendChild(actions);
  card.appendChild(media);
  card.appendChild(content);
  return card;
}
function renderGames() {
  track.innerHTML = "";
  indicatorsContainer.innerHTML = "";
  games.forEach((game, index) => {
    const card = createGameCard(game, index);
    track.appendChild(card);
    const indicator = document.createElement("div");
    indicator.className = "indicator" + (index === 0 ? " active" : "");
    indicator.dataset.index = index;
    indicator.onclick = () => goToSlide(index);
    indicatorsContainer.appendChild(indicator);
  });
  updateCarousel();
}
function updateCarousel() {
  const offset = -currentIndex * 100;
  track.style.transform = "translateX(" + offset + "%)";
  Array.from(indicatorsContainer.children).forEach((el, i) => {
    el.classList.toggle("active", i === currentIndex);
  });
}
function goToSlide(index) {
  if (index < 0) index = games.length - 1;
  if (index >= games.length) index = 0;
  currentIndex = index;
  updateCarousel();
}
document.getElementById("prevBtn").addEventListener("click", () => {
  goToSlide(currentIndex - 1);
});
document.getElementById("nextBtn").addEventListener("click", () => {
  goToSlide(currentIndex + 1);
});
let startX = 0;
let isDragging = false;
track.addEventListener("touchstart", e => {
  if (!e.touches.length) return;
  startX = e.touches[0].clientX;
  isDragging = true;
});
track.addEventListener("touchmove", e => {
  if (!isDragging || !e.touches.length) return;
});
track.addEventListener("touchend", e => {
  if (!isDragging) return;
  const endX = e.changedTouches[0].clientX;
  const delta = endX - startX;
  if (Math.abs(delta) > 50) {
    if (delta < 0) goToSlide(currentIndex + 1);
    else goToSlide(currentIndex - 1);
  }
  isDragging = false;
});
renderGames();
</script>
</body>
</html>
